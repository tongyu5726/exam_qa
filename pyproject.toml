[project]
name = "exam-rag"
version = "0.1.0"
description = "溯知（exam-rag）— 据源而答的课程资料问答"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "jieba>=0.42",
    "langgraph>=1.2.11",
    "chardet>=5.2,<6",
    "torch>=2.6",
]

[project.scripts]
exam = "src.main:main"

[project.optional-dependencies]
formula = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要 embedding 模型和 LLM API 的集成测试",
]
